services:
  - type: web
    name: artisanai
    runtime: python
    buildCommand: pip install -r backend/requirments.txt
    startCommand: gunicorn --chdir backend app:app
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
